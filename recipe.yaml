RecipeFormatVersion: 2020-01-25
ComponentName: aws.greengrass.labs.nodered.docker
ComponentVersion: 4.0.2
ComponentDescription: Run Node-RED in a container
ComponentPublisher: Amazon Web Services
ComponentConfiguration:
  DefaultConfiguration:
    headless: "false"
ComponentDependencies:
  aws.greengrass.DockerApplicationManager:
    VersionRequirement: ">0.0.0"
    DependencyType: SOFT
  aws.greengrass.TokenExchangeService:
    VersionRequirement: ">0.0.0"
  aws.greengrass.labs.nodered.auth:
    VersionRequirement: "~1.0.0"
    DependencyType: HARD
Manifests:
  - Lifecycle:
      Install:
        Script: |-
          mkdir -p data
      Run:
        Script: >-
          cat > data/settings.js <<EOF

          module.exports = {
              flowFile: "flows.json",
              flowFilePretty: false,
              userDir: "/data",
              uiPort: 1880,
              uiHost: "0.0.0.0",
              logging: {
                  console: {
                      level: "info",
                      metrics: false,
                      audit: false
                  }
              },
              exportGlobalContextKeys: false,
              externalModules: {
              },
              disableEditor: {configuration:/headless},
              editorTheme: {
                  palette: {},
                  projects: {enabled: false, workflow: { mode: "manual" }},
                  codeEditor: {lib: "monaco", options: { theme: "vs", }}
              },

              functionExternalModules: true,
              functionGlobalContext: {
                  // os:require("os"),
              },
              debugMaxLength: 1000,
              mqttReconnectTime: 15000,
              serialReconnectTime: 15000,
          EOF

          cat {aws.greengrass.labs.nodered.auth:work:path}/auth.js >> data/settings.js 

          echo "}" >> data/settings.js

          docker run --rm 
          -p 127.0.0.1:1880:1880 
          -v {kernel:rootPath}/ipc.socket:{kernel:rootPath}/ipc.socket 
          -e AWS_REGION 
          -e AWS_CONTAINER_AUTHORIZATION_TOKEN 
          -e AWS_CONTAINER_CREDENTIALS_FULL_URI="http://169.254.170.2/2016-11-01/credentialprovider/" 
          -e AWS_GG_NUCLEUS_DOMAIN_SOCKET_FILEPATH_FOR_COMPONENT 
          -e SVCUID 
          -e AWS_IOT_THING_NAME 
          -v $PWD/data:/data 
          --name node-red
          nodered/node-red:4.0.2
      Shutdown:
        Script: docker stop node-red
    Artifacts:
      - Uri: docker:nodered/node-red:4.0.2
